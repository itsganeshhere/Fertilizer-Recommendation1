<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Disease Prediction - Upload Image</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f9f9f9;
}
header {
background-color: #333;
color: white;
padding: 15px;
text-align: center;
}
.content {
padding: 20px;
text-align: center;
background-color: #d4d7a3;
}
.btn {
display: inline-block;
padding: 10px 20px;
color: white;
background-color: #5cb85c;
text-decoration: none;
border-radius: 5px;
}
</style>
</head>
<body>
<header>
<h1>Upload Plant Image</h1>
</header>
<div class="content">
<h2>Select an image of your plant to predict the disease</h2>
<form action="/predict" method="post" enctype="multipart/form-data">
<input type="file" name="image" accept="image/*" required>
<br><br>
<button type="submit" class="btn">Submit Image</button>
</form>
</div>
</body>
</html>
